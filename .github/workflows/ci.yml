name: CI


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # No install step: zero dependencies means the checkout is already runnable.
      - name: Show interpreter
        run: python -VV

      - name: Run the suite
        run: python tests/run.py

  benchmarks:
    name: benchmark claims
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # --check gates on the correctness claims; timings print but are not asserted.
      - name: Recovery, approval, and ledger claims
        run: python benchmarks/bench.py --check

      - name: Scheduling policies
        run: python benchmarks/schedulers.py

  security:
    name: capability ceiling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Adversarial attenuation (scripted)
        run: python benchmarks/attenuate.py

  package:
    name: packaging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Outside the source tree, so a passing import cannot be the repo shadowing it.
      - name: Install the wheel and run the console script
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/venv/bin/python -c "import agentos; print('agentos', agentos.__version__)"
          /tmp/venv/bin/agent --help > /dev/null
